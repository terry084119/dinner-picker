<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晚餐選擇障礙解答機 🍱</title>
  
  <!-- PWA & Mobile Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="晚餐解答機">
  <link rel="apple-touch-icon" href="https://fav.farm/🍱">
  <link rel="icon" href="https://fav.farm/🍱">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @keyframes slot-spin {
      0% { transform: scale(0.7) rotate(-10deg); opacity: 0.3; }
      50% { transform: scale(1.15) rotate(10deg); opacity: 0.8; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-pop {
      animation: slot-spin 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-warmGray-100 min-h-screen text-slate-800 font-sans flex flex-col items-center justify-between p-3 sm:p-6">

  <!-- App Main Card -->
  <div class="w-full max-w-md bg-white/90 rounded-3xl shadow-2xl overflow-hidden border border-amber-100/60 glass-card flex flex-col min-h-[660px]">
    
    <!-- Header (乾淨極簡) -->
    <div class="bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 p-6 text-white text-center relative shadow-lg">
      <div class="inline-block bg-white/20 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase mb-1 backdrop-blur-md">
        Decision Maker
      </div>
      <h1 class="text-2xl font-black tracking-wide flex items-center justify-center gap-2 drop-shadow">
        <span>🍱</span> 晚餐選擇障礙解答機
      </h1>
      <p class="text-xs text-amber-100 mt-1">今晚吃什麼？讓命運直接指派！</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-amber-100 bg-amber-50/50 text-sm font-bold">
      <button id="tabPickerBtn" onclick="switchTab('picker')" class="flex-1 py-3.5 text-center border-b-2 border-orange-500 text-orange-600 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-dice"></i> 命運盲盒
      </button>
      <button id="tabPocketBtn" onclick="switchTab('pocket')" class="flex-1 py-3.5 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-utensils"></i> 口袋名單 (<span id="menuCount">0</span>)
      </button>
    </div>

    <!-- TAB 1: 命運盲盒 -->
    <div id="tabPicker" class="p-5 flex-1 flex flex-col justify-between">
      
      <!-- Random Buttons -->
      <div class="space-y-2.5">
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="pickDinner('想吃好點')" class="group bg-gradient-to-br from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white p-3.5 rounded-2xl shadow-md hover:shadow-rose-200 font-bold text-sm flex items-center justify-center gap-2 transition active:scale-95">
            <span class="text-base group-hover:scale-125 transition-transform">🥩</span>
            <span>想吃好點 (犒賞)</span>
          </button>
          <button onclick="pickDinner('簡單吃飽')" class="group bg-gradient-to-br from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white p-3.5 rounded-2xl shadow-md hover:shadow-emerald-200 font-bold text-sm flex items-center justify-center gap-2 transition active:scale-95">
            <span class="text-base group-hover:scale-125 transition-transform">🍱</span>
            <span>簡單吃飽 (平價)</span>
          </button>
        </div>
        
        <button onclick="pickDinner('ALL')" class="w-full bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-600 hover:to-orange-600 text-white p-4 rounded-2xl shadow-lg hover:shadow-orange-200 font-black text-base flex items-center justify-center gap-2 transition active:scale-98">
          <i class="fa-solid fa-shuffle text-amber-200"></i> 命運隨機盲盒 (不限風格)
        </button>
      </div>

      <!-- Result Card -->
      <div id="resultBox" class="my-4 p-6 rounded-3xl bg-gradient-to-b from-amber-50/60 to-white border-2 border-dashed border-amber-200/80 text-center flex flex-col items-center justify-center min-h-[230px] shadow-inner relative overflow-hidden">
        
        <div id="placeholderState" class="text-amber-800/40 py-4">
          <div class="text-6xl mb-3 animate-bounce">🔮</div>
          <p class="text-sm font-bold">點擊上方按鈕，交給命運指派！</p>
        </div>

        <div id="resultContent" class="hidden w-full flex flex-col items-center">
          <div id="foodEmoji" class="text-6xl mb-2 filter drop-shadow">🍱</div>
          <h2 id="foodName" class="text-2xl font-black text-slate-800 mb-2">牛肉麵</h2>
          
          <div id="foodBadges" class="flex flex-wrap gap-1.5 justify-center mb-3">
            <!-- Dynamic Badges -->
          </div>

          <p id="foodNote" class="text-xs text-slate-600 italic bg-white/80 backdrop-blur-sm px-3.5 py-1.5 rounded-xl border border-amber-100 mb-2 max-w-xs shadow-sm">
            "記得加酸菜與一盤小菜犒賞自己！"
          </p>

          <p id="foodPunchline" class="text-xs font-bold text-orange-700 bg-orange-100/80 px-3.5 py-1.5 rounded-xl border border-orange-200/60 max-w-xs">
            👉 別想了，今天的煩惱喝湯就解決了一半！
          </p>
        </div>
      </div>

      <!-- Controls & Limits -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-500 px-1 font-semibold">
          <span>決策鎖定機制：</span>
          <span>今日換選機會：<strong id="chanceCount" class="text-orange-600 text-sm font-black">2</strong> / 2 次</span>
        </div>

        <button id="rerollBtn" onclick="rerollDinner()" disabled class="w-full bg-slate-200 text-slate-400 py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-not-allowed">
          <i class="fa-solid fa-rotate-right"></i> 不滿意？換一個 (<span id="rerollText">剩 2 次</span>)
        </button>
      </div>

    </div>

    <!-- TAB 2: 口袋名單 & 新增選項 -->
    <div id="tabPocket" class="p-5 flex-1 hidden flex-col justify-between overflow-y-auto max-h-[520px]">
      
      <!-- Add Item Form -->
      <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-2xl border border-amber-200/80 mb-4 shadow-sm">
        <h3 class="text-xs font-black text-amber-900 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-plus-circle text-orange-500"></i> 新增美食選項
        </h3>
        <div class="grid grid-cols-3 gap-2 mb-2">
          <input type="text" id="addEmoji" class="col-span-1 p-2 border border-amber-200 rounded-xl text-xs text-center bg-white" placeholder="圖示 🍱">
          <input type="text" id="addName" class="col-span-2 p-2 border border-amber-200 rounded-xl text-xs bg-white" placeholder="食物名稱 (例: 肉圓)">
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2.5">
          <select id="addCategory" class="p-2 border border-amber-200 rounded-xl text-xs bg-white font-medium">
            <option value="簡單吃飽">簡單吃飽 (平價)</option>
            <option value="想吃好點">想吃好點 (犒賞)</option>
          </select>
          <input type="text" id="addNote" class="p-2 border border-amber-200 rounded-xl text-xs bg-white" placeholder="備註 (例: 加辣更好吃)">
        </div>
        <button onclick="addCustomItem()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white p-2.5 rounded-xl text-xs font-bold transition shadow-sm active:scale-98">
          新增至菜單庫
        </button>
      </div>

      <!-- Item List -->
      <div class="flex-1">
        <h3 class="text-xs font-bold text-slate-400 mb-2 flex items-center justify-between">
          <span>目前菜單列表</span>
          <span class="text-[10px] text-slate-400">背景自動同步中</span>
        </h3>
        <div id="pocketList" class="space-y-2">
          <!-- Dynamic Items -->
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="bg-slate-50/80 border-t border-amber-100 p-3 text-center text-[11px] text-slate-400">
      晚餐選擇障礙解答機 • 告別猶豫不決 🍱
    </div>

  </div>

  <script>
    // 1. Google 試算表唯讀讀取網址 (CSV)
    const READ_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTNSwBI_qGNOjnE6yKY28ohuvqhc2RkA5p333vMqlT47G3jsR9mGVQVqFVoE0WL-g1VHfwba_6RLo82/pub?output=csv";

    // 2. Google Apps Script 寫入網址 (請填入完成步驟二產生的網址)
    const WRITE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    let currentMenu = [];
    let rerollChances = 2;
    let lastFilter = 'ALL';

    window.addEventListener('DOMContentLoaded', () => {
      syncGoogleSheets();
    });

    function switchTab(tab) {
      const picker = document.getElementById('tabPicker');
      const pocket = document.getElementById('tabPocket');
      const pBtn = document.getElementById('tabPickerBtn');
      const kBtn = document.getElementById('tabPocketBtn');

      if (tab === 'picker') {
        picker.classList.remove('hidden');
        pocket.classList.add('hidden');
        pocket.classList.remove('flex');
        pBtn.className = "flex-1 py-3.5 text-center border-b-2 border-orange-500 text-orange-600 transition-all flex items-center justify-center gap-2 font-bold";
        kBtn.className = "flex-1 py-3.5 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center justify-center gap-2 font-bold";
      } else {
        pocket.classList.remove('hidden');
        pocket.classList.add('flex');
        picker.classList.add('hidden');
        kBtn.className = "flex-1 py-3.5 text-center border-b-2 border-orange-500 text-orange-600 transition-all flex items-center justify-center gap-2 font-bold";
        pBtn.className = "flex-1 py-3.5 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center justify-center gap-2 font-bold";
        renderPocketList();
      }
    }

    // 背景靜默同步
    async function syncGoogleSheets() {
      try {
        const response = await fetch(READ_CSV_URL);
        if (!response.ok) throw new Error("Fetch failed");
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        if (parsedData.length > 0) {
          currentMenu = parsedData;
          localStorage.setItem('dinner_custom_menu', JSON.stringify(currentMenu));
        }
      } catch (err) {
        console.warn("Silent sync fallback to local cache");
        const saved = localStorage.getItem('dinner_custom_menu');
        if (saved) currentMenu = JSON.parse(saved);
      }

      document.getElementById('menuCount').innerText = currentMenu.length;
      renderPocketList();
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      const parseLine = line => {
        const res = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') inQ = !inQ;
          else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ''; }
          else cur += c;
        }
        res.push(cur.trim());
        return res.map(v => v.replace(/^"|"$/g, '').replace(/""/g, '"'));
      };

      const items = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const vals = parseLine(lines[i]);
        if (vals.length < 2) continue;

        items.push({
          id: "sheet_" + i,
          name: vals[0] || "未命名美食",
          category: vals[1] || "簡單吃飽",
          emoji: vals[2] || "🍱",
          temp: vals[3] || "乾食",
          flavor: vals[4] || "一般",
          lateNight: vals[5] === "是",
          rainy: vals[6] === "是",
          tags: vals[7] ? vals[7].split(',').map(s => s.trim()) : [],
          note: vals[8] || "享用就對了！",
          punchline: "命運指派，不許挑食！"
        });
      }
      return items;
    }

    function pickDinner(filter = 'ALL') {
      lastFilter = filter;
      rerollChances = 2;
      updateChanceUI();

      let candidates = currentMenu;
      if (filter === '想吃好點') candidates = currentMenu.filter(i => i.category === '想吃好點');
      else if (filter === '簡單吃飽') candidates = currentMenu.filter(i => i.category === '簡單吃飽');

      if (candidates.length === 0) candidates = currentMenu;

      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      displayResult(chosen);
    }

    function rerollDinner() {
      if (rerollChances <= 0) return;

      rerollChances--;
      updateChanceUI();

      if (rerollChances === 0) {
        const punishment = {
          name: "便利商店茶葉蛋 + 地瓜 + 蛋白飲",
          category: "懲罰",
          emoji: "🥚",
          temp: "乾食",
          flavor: "清爽負擔低",
          note: "猶豫太久的懲罰套餐！",
          punchline: "你已經換太多次了！請接受超商組合作為懲罰！"
        };
        displayResult(punishment);
      } else {
        let candidates = currentMenu;
        if (lastFilter === '想吃好點') candidates = currentMenu.filter(i => i.category === '想吃好點');
        else if (lastFilter === '簡單吃飽') candidates = currentMenu.filter(i => i.category === '簡單吃飽');
        if (candidates.length === 0) candidates = currentMenu;

        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        displayResult(chosen);
      }
    }

    function displayResult(item) {
      document.getElementById('placeholderState').classList.add('hidden');
      const content = document.getElementById('resultContent');
      content.classList.remove('hidden');

      const emojiEl = document.getElementById('foodEmoji');
      emojiEl.classList.remove('animate-pop');
      void emojiEl.offsetWidth;
      emojiEl.classList.add('animate-pop');

      emojiEl.innerText = item.emoji || "🍱";
      document.getElementById('foodName').innerText = item.name;
      document.getElementById('foodNote').innerText = item.note ? `"${item.note}"` : `"好好享受這一餐！"`;
      document.getElementById('foodPunchline').innerText = `👉 ${item.punchline || "別想了，現在就出發！"}`;

      const badgesContainer = document.getElementById('foodBadges');
      badgesContainer.innerHTML = '';

      const catBadge = document.createElement('span');
      catBadge.className = item.category === '想吃好點' ? "px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800" : "px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800";
      catBadge.innerText = item.category;
      badgesContainer.appendChild(catBadge);

      if (item.temp) {
        const tempB = document.createElement('span');
        tempB.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800";
        tempB.innerText = item.temp;
        badgesContainer.appendChild(tempB);
      }

      if (item.flavor) {
        const flavB = document.createElement('span');
        flavB.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800";
        flavB.innerText = item.flavor;
        badgesContainer.appendChild(flavB);
      }

      const rerollBtn = document.getElementById('rerollBtn');
      if (rerollChances > 0) {
        rerollBtn.disabled = false;
        rerollBtn.className = "w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition active:scale-98 cursor-pointer shadow-md";
      } else {
        rerollBtn.disabled = true;
        rerollBtn.className = "w-full bg-slate-200 text-slate-400 py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-not-allowed";
      }
    }

    function updateChanceUI() {
      document.getElementById('chanceCount').innerText = rerollChances;
      document.getElementById('rerollText').innerText = rerollChances > 0 ? `剩 ${rerollChances} 次` : '決策鎖定';
    }

    function renderPocketList() {
      const list = document.getElementById('pocketList');
      list.innerHTML = '';

      currentMenu.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-3 bg-white rounded-xl border border-slate-200/80 flex items-center justify-between text-xs shadow-sm";
        div.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="text-xl">${item.emoji || '🍱'}</span>
            <div>
              <strong class="text-slate-800 text-sm">${item.name}</strong>
              <div class="text-[10px] text-slate-400">${item.category} • ${item.flavor || ''}</div>
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    // 前台新增品項，並背景寫入 Google 試算表
    async function addCustomItem() {
      const emoji = document.getElementById('addEmoji').value.trim() || '🍱';
      const name = document.getElementById('addName').value.trim();
      const category = document.getElementById('addCategory').value;
      const note = document.getElementById('addNote').value.trim() || '口袋熱門美食';

      if (!name) return alert('請輸入食物名稱');

      const newItem = {
        id: "custom_" + Date.now(),
        name, category, emoji,
        temp: "乾食", flavor: "自訂",
        lateNight: "否", rainy: "是",
        tags: "自訂", note, punchline: "自己新增的美味！"
      };

      // 1. 本機即時加入
      currentMenu.unshift(newItem);
      localStorage.setItem('dinner_custom_menu', JSON.stringify(currentMenu));
      document.getElementById('addName').value = '';
      document.getElementById('addNote').value = '';
      document.getElementById('menuCount').innerText = currentMenu.length;
      renderPocketList();

      // 2. 背景同步寫回 Google 試算表
      if (WRITE_SCRIPT_URL && WRITE_SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
        try {
          fetch(WRITE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newItem)
          });
        } catch(e) { console.warn("Background write failed", e); }
      }
    }
  </script>
</body>
</html>
