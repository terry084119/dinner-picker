<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晚餐選擇障礙解答機 🍱</title>
  
  <!-- PWA & Mobile Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="晚餐解答機">
  <link rel="apple-touch-icon" href="https://fav.farm/🍱">
  <link rel="icon" href="https://fav.farm/🍱">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .animate-bounce-short {
      animation: bounce 0.6s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    .spin-anim {
      animation: spin 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }
    @keyframes spin {
      0% { transform: rotate(0deg) scale(0.8); opacity: 0.3; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 0.8; }
      100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col items-center justify-between p-3 sm:p-6">

  <!-- Top App Container -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 flex flex-col min-h-[640px]">
    
    <!-- Header Area -->
    <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-5 text-white text-center relative shadow-md">
      <h1 class="text-2xl font-black tracking-wide flex items-center justify-center gap-2">
        <span>🍱</span> 晚餐選擇障礙解答機
      </h1>
      <p class="text-xs text-amber-100 mt-1 opacity-90">專治晚餐糾結症 • 命運指派不許不服</p>
      
      <!-- Live Sync Badge -->
      <div id="syncBadge" class="mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs bg-black/20 backdrop-blur-sm border border-white/20 text-white">
        <i class="fa-solid fa-circle-notch fa-spin text-amber-200"></i>
        <span>正同步 Google 試算表...</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-bold">
      <button id="tabPickerBtn" onclick="switchTab('picker')" class="flex-1 py-3 text-center border-b-2 border-orange-500 text-orange-600 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-dice"></i> 命運盲盒
      </button>
      <button id="tabPocketBtn" onclick="switchTab('pocket')" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-list-check"></i> 口袋名單 (<span id="menuCount">25</span>)
      </button>
    </div>

    <!-- MAIN TAB 1: 命運盲盒 -->
    <div id="tabPicker" class="p-5 flex-1 flex flex-col justify-between">
      
      <!-- Random Buttons Section -->
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">請選擇你的今晚心境</p>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <button onclick="pickDinner('想吃好點')" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white p-3 rounded-2xl shadow-md font-bold text-sm flex items-center justify-center gap-1.5 transition active:scale-95">
            <span>🥩</span> 想吃好點 (犒賞)
          </button>
          <button onclick="pickDinner('簡單吃飽')" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white p-3 rounded-2xl shadow-md font-bold text-sm flex items-center justify-center gap-1.5 transition active:scale-95">
            <span>🍱</span> 簡單吃飽 (平價)
          </button>
        </div>
        <button onclick="pickDinner('ALL')" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white p-3.5 rounded-2xl shadow-lg font-black text-base flex items-center justify-center gap-2 transition active:scale-98">
          <i class="fa-solid fa-shuffle"></i> 命運隨機盲盒 (不限風格)
        </button>
      </div>

      <!-- Result Display Card -->
      <div id="resultBox" class="my-4 p-5 rounded-3xl bg-slate-50 border-2 border-dashed border-slate-200 text-center flex flex-col items-center justify-center min-h-[220px] transition-all relative overflow-hidden">
        <div id="placeholderState" class="text-slate-400">
          <div class="text-5xl mb-2 opacity-60">🔮</div>
          <p class="text-sm font-medium">點擊上方按鈕，讓命運幫你做決定！</p>
        </div>

        <div id="resultContent" class="hidden w-full flex flex-col items-center">
          <div id="foodEmoji" class="text-6xl mb-2 spin-anim">🍱</div>
          <h2 id="foodName" class="text-2xl font-black text-slate-800 mb-2">牛肉麵</h2>
          
          <!-- Badges -->
          <div id="foodBadges" class="flex flex-wrap gap-1.5 justify-center mb-3">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">想吃好點</span>
          </div>

          <!-- Side Note -->
          <p id="foodNote" class="text-xs text-slate-500 italic bg-white px-3 py-1.5 rounded-xl border border-slate-200 mb-2 max-w-xs">
            "記得加酸菜與一盤小菜犒賞自己！"
          </p>

          <!-- Punchline -->
          <p id="foodPunchline" class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-xl border border-orange-200 max-w-xs">
            👉 別想了，今天的煩惱喝湯就解決了一半！
          </p>
        </div>
      </div>

      <!-- Controls & Limits -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-500 px-1 font-medium">
          <span>決策鎖定機制：</span>
          <span>今日換選機會：<strong id="chanceCount" class="text-orange-600 text-sm font-black">2</strong> / 2 次</span>
        </div>

        <button id="rerollBtn" onclick="rerollDinner()" disabled class="w-full bg-slate-200 text-slate-400 py-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-not-allowed">
          <i class="fa-solid fa-rotate-right"></i> 不滿意？換一個 (<span id="rerollText">剩 2 次</span>)
        </button>
      </div>

    </div>

    <!-- MAIN TAB 2: 口袋名單 & Google 試算表串接 -->
    <div id="tabPocket" class="p-5 flex-1 hidden flex-col justify-between overflow-y-auto max-h-[500px]">
      
      <!-- Sheets Sync Box -->
      <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl mb-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-black text-amber-900 flex items-center gap-1.5">
            <i class="fa-solid fa-file-csv text-amber-600"></i> Google 試算表串接
          </h3>
          <span id="syncStatusTag" class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">自動連線中</span>
        </div>
        <p class="text-xs text-amber-700 mb-2 leading-relaxed">
          系統會自動從你的 Google 試算表同步菜單。也可以在下方手動更新 CSV 網址：
        </p>
        <div class="flex gap-2">
          <input type="text" id="csvUrlInput" class="flex-1 text-xs p-2 rounded-xl border border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv">
          <button onclick="manualSyncCSV()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap">
            同步
          </button>
        </div>
      </div>

      <!-- Add Custom Item Form -->
      <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 mb-4">
        <h3 class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1">
          <i class="fa-solid fa-plus-circle"></i> 手動新增暫存品項
        </h3>
        <div class="grid grid-cols-3 gap-2 mb-2">
          <input type="text" id="addEmoji" class="col-span-1 p-2 border rounded-xl text-xs text-center" placeholder="圖示 (🍱)">
          <input type="text" id="addName" class="col-span-2 p-2 border rounded-xl text-xs" placeholder="食物名稱 (例: 肉圓)">
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <select id="addCategory" class="p-2 border rounded-xl text-xs bg-white">
            <option value="簡單吃飽">簡單吃飽 (平價)</option>
            <option value="想吃好點">想吃好點 (犒賞)</option>
          </select>
          <input type="text" id="addNote" class="p-2 border rounded-xl text-xs" placeholder="備註 (例: 加辣最好吃)">
        </div>
        <button onclick="addCustomItem()" class="w-full bg-slate-800 hover:bg-slate-900 text-white p-2 rounded-xl text-xs font-bold transition">
          加入本機清單
        </button>
      </div>

      <!-- Pocket List -->
      <div class="flex-1">
        <h3 class="text-xs font-bold text-slate-400 mb-2 flex items-center justify-between">
          <span>目前菜單列表</span>
          <button onclick="resetDefaultMenu()" class="text-[10px] text-slate-400 hover:text-red-500 underline">重置預設檔</button>
        </h3>
        <div id="pocketList" class="space-y-2">
          <!-- Items inserted via JS -->
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="bg-slate-50 border-t border-slate-200 p-3 text-center text-[11px] text-slate-400">
      晚餐選擇障礙解答機 • 專治猶豫不決
    </div>

  </div>

  <script>
    // 預設完整的 CSV 網址（已整合使用者提供之發布網址）
    const DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTNSwBI_qGNOjnE6yKY28ohuvqhc2RkA5p333vMqlT47G3jsR9mGVQVqFVoE0WL-g1VHfwba_6RLo82/pub?output=csv";

    // 預設後備資料（當網路斷線時備用）
    const FALLBACK_MENU = [
      { id: "001", name: "燒肉便當 / 排骨飯", category: "簡單吃飽", emoji: "🍱", temp: "乾食", flavor: "經典台式", lateNight: false, rainy: true, tags: ["便當", "經典"], note: "排骨加辣更夠味！", punchline: "別想了，台式便當永遠是你的靈魂歸宿。" },
      { id: "002", name: "牛肉麵", category: "想吃好點", emoji: "🥩", temp: "熱湯水", flavor: "重口味舒壓", lateNight: false, rainy: true, tags: ["湯麵", "重口味"], note: "酸菜加滿配花麩！", punchline: "熱湯喝下去，今天的煩惱就解決了一半。" },
      { id: "003", name: "健康餐盒", category: "想吃好點", emoji: "🍳", temp: "乾食", flavor: "清爽負擔低", lateNight: false, rainy: true, tags: ["清爽", "高蛋白"], note: "舒肥雞胸配紫米飯", punchline: "給腸胃放個假，明天起來神清氣爽。" },
      { id: "004", name: "鹹酥雞", category: "想吃好點", emoji: "🍗", temp: "乾食", flavor: "罪惡滿點", lateNight: true, rainy: true, tags: ["罪惡", "宵夜"], note: "九層塔與蒜碎加爆！", punchline: "卡路里什麼的明天再說，今天你需要這個酷東西。" },
      { id: "005", name: "個人小火鍋", category: "想吃好點", emoji: "🍲", temp: "熱湯水", flavor: "重口味舒壓", lateNight: true, rainy: false, tags: ["暖胃", "豐富"], note: "醬料區蒜泥加滿", punchline: "天氣這麼冷，不吃火鍋對得起自己嗎？" },
      { id: "006", name: "鹹水雞", category: "簡單吃飽", emoji: "🐔", temp: "乾食", flavor: "清爽負擔低", lateNight: true, rainy: true, tags: ["清爽", "宵夜"], note: "加筍片與花椰菜", punchline: "清爽無負擔，宵夜首選。" },
      { id: "007", name: "便利商店茶葉蛋 + 地瓜 + 蛋白飲", category: "懲罰", emoji: "🥚", temp: "乾食", flavor: "清爽負擔低", lateNight: true, rainy: true, tags: ["懲罰套餐"], note: "猶豫太久的懲罰套餐", punchline: "你已經換太多次了！請接受超商組合作為猶豫不決的懲罰！" }
    ];

    // State Variables
    let currentMenu = [];
    let rerollChances = 2;
    let lastFilter = 'ALL';
    let currentSelectedItem = null;

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('csvUrlInput').value = localStorage.getItem('dinner_csv_url') || DEFAULT_CSV_URL;
      loadSavedMenu();
      syncGoogleSheets(document.getElementById('csvUrlInput').value);
    });

    // Tab Switcher
    function switchTab(tab) {
      const picker = document.getElementById('tabPicker');
      const pocket = document.getElementById('tabPocket');
      const pBtn = document.getElementById('tabPickerBtn');
      const kBtn = document.getElementById('tabPocketBtn');

      if (tab === 'picker') {
        picker.classList.remove('hidden');
        pocket.classList.add('hidden');
        pocket.classList.remove('flex');
        pBtn.className = "flex-1 py-3 text-center border-b-2 border-orange-500 text-orange-600 transition-all flex items-center justify-center gap-2 font-bold";
        kBtn.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center justify-center gap-2 font-bold";
      } else {
        pocket.classList.remove('hidden');
        pocket.classList.add('flex');
        picker.classList.add('hidden');
        kBtn.className = "flex-1 py-3 text-center border-b-2 border-orange-500 text-orange-600 transition-all flex items-center justify-center gap-2 font-bold";
        pBtn.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center justify-center gap-2 font-bold";
        renderPocketList();
      }
    }

    // Google Sheets CSV Sync
    async function syncGoogleSheets(url) {
      const badge = document.getElementById('syncBadge');
      const tag = document.getElementById('syncStatusTag');
      badge.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-amber-200"></i> <span>同步中...</span>`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        if (parsedData.length > 0) {
          currentMenu = parsedData;
          localStorage.setItem('dinner_custom_menu', JSON.stringify(currentMenu));
          localStorage.setItem('dinner_csv_url', url);
          
          badge.innerHTML = `<i class="fa-solid fa-check text-emerald-300"></i> <span>已同步 ${currentMenu.length} 項 Google 菜單</span>`;
          tag.innerText = `已連結 ${currentMenu.length} 項`;
          tag.className = "text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold";
        } else {
          throw new Error("無效的 CSV 內容");
        }
      } catch (err) {
        console.warn("Google Sheets Sync fallback:", err);
        badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300"></i> <span>讀取本機預設選單</span>`;
        tag.innerText = "本機模式";
        tag.className = "text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-bold";
      }

      document.getElementById('menuCount').innerText = currentMenu.length;
      renderPocketList();
    }

    function manualSyncCSV() {
      const url = document.getElementById('csvUrlInput').value.trim();
      if (url) syncGoogleSheets(url);
    }

    // CSV Parser supporting standard 9 columns
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      const parseLine = line => {
        const res = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') inQ = !inQ;
          else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ''; }
          else cur += c;
        }
        res.push(cur.trim());
        return res.map(v => v.replace(/^"|"$/g, '').replace(/""/g, '"'));
      };

      const headers = parseLine(lines[0]);
      const items = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const vals = parseLine(lines[i]);
        if (vals.length < 2) continue;

        items.push({
          id: "sheet_" + i,
          name: vals[0] || "未命名美食",
          category: vals[1] || "簡單吃飽",
          emoji: vals[2] || "🍱",
          temp: vals[3] || "乾食",
          flavor: vals[4] || "一般",
          lateNight: vals[5] === "是",
          rainy: vals[6] === "是",
          tags: vals[7] ? vals[7].split(',').map(s => s.trim()) : [],
          note: vals[8] || "美食當前，享用就對了！",
          punchline: "命運指派，不許挑食！"
        });
      }

      return items;
    }

    // Load / Save Local Storage
    function loadSavedMenu() {
      const saved = localStorage.getItem('dinner_custom_menu');
      if (saved) {
        try { currentMenu = JSON.parse(saved); } catch(e) { currentMenu = FALLBACK_MENU; }
      } else {
        currentMenu = FALLBACK_MENU;
      }
      document.getElementById('menuCount').innerText = currentMenu.length;
    }

    // Decision Logic
    function pickDinner(filter = 'ALL') {
      lastFilter = filter;
      rerollChances = 2;
      updateChanceUI();

      let candidates = currentMenu;
      if (filter === '想吃好點') {
        candidates = currentMenu.filter(i => i.category === '想吃好點');
      } else if (filter === '簡單吃飽') {
        candidates = currentMenu.filter(i => i.category === '簡單吃飽');
      }

      if (candidates.length === 0) candidates = currentMenu;

      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      displayResult(chosen);
    }

    function rerollDinner() {
      if (rerollChances <= 0) return;

      rerollChances--;
      updateChanceUI();

      if (rerollChances === 0) {
        // Trigger Punishment Item
        const punishment = {
          name: "便利商店茶葉蛋 + 地瓜 + 蛋白飲",
          category: "懲罰",
          emoji: "🥚",
          temp: "乾食",
          flavor: "極致健康",
          tags: ["懲罰套餐", "猶豫不決"],
          note: "這是換太多次的猶豫處罰！",
          punchline: "你已經換太多次了！請接受超商組合作為懲罰！"
        };
        displayResult(punishment);
      } else {
        let candidates = currentMenu;
        if (lastFilter === '想吃好點') candidates = currentMenu.filter(i => i.category === '想吃好點');
        else if (lastFilter === '簡單吃飽') candidates = currentMenu.filter(i => i.category === '簡單吃飽');
        if (candidates.length === 0) candidates = currentMenu;

        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        displayResult(chosen);
      }
    }

    function displayResult(item) {
      currentSelectedItem = item;

      document.getElementById('placeholderState').classList.add('hidden');
      const content = document.getElementById('resultContent');
      content.classList.remove('hidden');

      // Trigger Spin Anim
      const emojiEl = document.getElementById('foodEmoji');
      emojiEl.classList.remove('spin-anim');
      void emojiEl.offsetWidth; // Force Reflow
      emojiEl.classList.add('spin-anim');

      emojiEl.innerText = item.emoji || "🍱";
      document.getElementById('foodName').innerText = item.name;
      document.getElementById('foodNote').innerText = item.note ? `"${item.note}"` : `"好好享受這一餐！"`;
      document.getElementById('foodPunchline').innerText = `👉 ${item.punchline || "別想了，現在就出發！"}`;

      // Badges
      const badgesContainer = document.getElementById('foodBadges');
      badgesContainer.innerHTML = '';

      const catBadge = document.createElement('span');
      catBadge.className = item.category === '想吃好點' ? "px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800" : "px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800";
      catBadge.innerText = item.category;
      badgesContainer.appendChild(catBadge);

      if (item.temp) {
        const tempB = document.createElement('span');
        tempB.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800";
        tempB.innerText = item.temp;
        badgesContainer.appendChild(tempB);
      }

      if (item.flavor) {
        const flavB = document.createElement('span');
        flavB.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800";
        flavB.innerText = item.flavor;
        badgesContainer.appendChild(flavB);
      }

      // Enable Reroll Button
      const rerollBtn = document.getElementById('rerollBtn');
      if (rerollChances > 0) {
        rerollBtn.disabled = false;
        rerollBtn.className = "w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition active:scale-98 cursor-pointer shadow-md";
      } else {
        rerollBtn.disabled = true;
        rerollBtn.className = "w-full bg-slate-200 text-slate-400 py-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-not-allowed";
      }
    }

    function updateChanceUI() {
      document.getElementById('chanceCount').innerText = rerollChances;
      document.getElementById('rerollText').innerText = rerollChances > 0 ? `剩 ${rerollChances} 次` : '決策鎖定';
    }

    // Manual Pocket Menu Management
    function renderPocketList() {
      const list = document.getElementById('pocketList');
      list.innerHTML = '';

      currentMenu.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-2.5 bg-white rounded-xl border border-slate-200 flex items-center justify-between text-xs";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-base">${item.emoji || '🍱'}</span>
            <div>
              <strong class="text-slate-800">${item.name}</strong>
              <div class="text-[10px] text-slate-400">${item.category} • ${item.flavor || ''}</div>
            </div>
          </div>
          <button onclick="deleteCustomItem(${index})" class="text-slate-300 hover:text-red-500 p-1">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        list.appendChild(div);
      });
    }

    function addCustomItem() {
      const emoji = document.getElementById('addEmoji').value.trim() || '🍱';
      const name = document.getElementById('addName').value.trim();
      const category = document.getElementById('addCategory').value;
      const note = document.getElementById('addNote').value.trim() || '口袋熱門美食';

      if (!name) return alert('請輸入食物名稱');

      currentMenu.unshift({
        id: "custom_" + Date.now(),
        name, category, emoji,
        temp: "乾食", flavor: "自訂風格",
        note, punchline: "自己新增的美味選項！"
      });

      localStorage.setItem('dinner_custom_menu', JSON.stringify(currentMenu));
      document.getElementById('addName').value = '';
      document.getElementById('addNote').value = '';
      document.getElementById('menuCount').innerText = currentMenu.length;
      renderPocketList();
    }

    function deleteCustomItem(index) {
      currentMenu.splice(index, 1);
      localStorage.setItem('dinner_custom_menu', JSON.stringify(currentMenu));
      document.getElementById('menuCount').innerText = currentMenu.length;
      renderPocketList();
    }

    function resetDefaultMenu() {
      if (confirm('確定要恢復為預設菜單嗎？')) {
        localStorage.removeItem('dinner_custom_menu');
        currentMenu = FALLBACK_MENU;
        document.getElementById('menuCount').innerText = currentMenu.length;
        renderPocketList();
      }
    }
  </script>
</body>
</html>
